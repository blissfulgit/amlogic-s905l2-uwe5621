# ⚠️ 默认禁用 —— 这是刻意留空的
#
# 不要把 uwe5622_bsp_sdio / sprdwl_ng / sprdbt_tty 放进 modules-load.d。
# 阶段太早（sysinit），此时 sdio-pwrseq 的 regulator 与 mmc 控制器还没就绪，
# 驱动 probe 会失败并留下脏状态：
#
#   WCN_ERR: didn't get CP2 version
#   uwe5622_bsp_sdio: probe of ... failed with error -1
#
# 之后再 modprobe 也不会恢复，必须重启。
#
# 正确做法：由 uwe5622-wifi.service 在 multi-user.target 之后加载。
# 本文件保留是为了占位，防止有人（包括未来的你）又往里写模块名。
#
# 安装位置: /etc/modules-load.d/uwe5622.conf

# disabled on purpose -- see comment above
