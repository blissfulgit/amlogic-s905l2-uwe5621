# UWE5621 SDIO host 绑定
#
# 必须显式指定 sdio_host，否则 uwe5622_bsp_sdio 在 probe 时找不到
# 承载 WiFi 芯片的那个 mmc 控制器（S905L2 上是 d0070000.mmc，即 mmc0/sd_emmc_a）。
#
# 症状：不写这行 -> modprobe 成功但 lsmod 里模块没有被 sprdwl_ng 引用，
#       dmesg 无 marlin_probe，wlan0 永不出现。
#
# 安装位置: /etc/modprobe.d/uwe5622.conf

options uwe5622_bsp_sdio sdio_host=d0070000.mmc
